name: Send Daily c-owl News Email

on:
  # 記事が公開された直後に送信する（cron の時刻と生成完了時刻の競合を避けるため）
  push:
    branches: [main]
    paths:
      - 'news/**'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          python3 scripts/send_email.py news "[c-owl] 外国人材ニュース" "$TODAY"
