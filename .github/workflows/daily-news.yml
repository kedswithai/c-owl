name: Daily c-owl News Pipeline

# 外国人材ニュースの収集 → ファクトチェック → advocate → 公開までを通しで実行する。
# 仕様は CLAUDE.md、指示文は prompts/news-pipeline.md。
#
# 旧構成（claude.ai のクラウドルーティン）では実行環境のエグレスプロキシにより
# 政府サイトへの WebFetch が全面的に遮断され、出典URLの裏取りができなかった。
# GitHub Actions のランナーからは到達できることを確認済み（2026-10-03）。

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC = 翌 07:00 JST
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN による push は他のワークフローを起動しない仕様のため、
          # news/** への push で動く daily-news-email.yml が発火しない。
          # メール配信を維持するために PAT を使う。
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.email "agent@c-owl.jp"
          git config user.name "c-owl News Agent"

      - name: Run pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat prompts/news-pipeline.md)" \
            --allowedTools "Bash Read Write Edit Glob Grep WebSearch WebFetch" \
            --permission-mode acceptEdits \
            --output-format text

      - name: Ensure today's file exists
        # パイプラインが落ちても news/$DATE.md は必ず残す。
        # このファイルの push がメール配信のトリガーなので、
        # 作られないと「失敗したこと自体」が誰にも伝わらない。
        if: always()
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git pull --rebase origin main || git rebase --abort || true

          if [ -f "news/$DATE.md" ]; then
            echo "news/$DATE.md は作成済みです。セーフティネットは何もしません。"
            exit 0
          fi

          echo "news/$DATE.md が存在しません。失敗記録を作成します。"
          mkdir -p news
          cat > "news/$DATE.md" <<EOF
          # c-owl 外国人材ニュース $DATE

          ## 本日の公開記事: 0件（目標6件）

          > ⚠️ 実行エラー: パイプラインが \`news/$DATE.md\` を生成せずに終了しました。
          > 記事の内容ではなく、実行そのものに問題が発生しています。
          >
          > 実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---

          本日公開できる記事はありません。
          EOF

          git add "news/$DATE.md"
          git commit -m "publish: news $DATE (0/6 — pipeline produced no output)"
          git push origin HEAD:main
